name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Test
      run: npm test

    - name: Build
      run: npm run build

    - name: Smoke import CJS
      run: node -e "require('./dist/index.cjs')"

    - name: Smoke import ESM
      run: node --input-type=module -e "import('./dist/index.js')"

    - name: Pack dry-run
      run: npm pack --dry-run
