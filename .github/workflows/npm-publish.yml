# Publish the self-contained root package `markup-generator` to npm when a
# GitHub Release is published.
#
# Workspace packages under packages/ (@llazyemail/*) are marked private: true
# and are bundled into markup-generator's dist via tsup `noExternal`. They are
# not published. `pnpm -r publish` therefore publishes only the root package
# (private workspace members are skipped).
#
# Auth: npm trusted publishing (OIDC, id-token: write) — register this
# repo/workflow as a trusted publisher for the `markup-generator` package on
# npm. If the version is already on npm, pnpm skips it (exit 0).

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (do not publish)'
        required: false
        type: boolean
        default: true

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm exec turbo run build test lint

      - name: Publish dry run (private workspace packages skipped; only markup-generator)
        run: pnpm -r publish --dry-run --access public --no-git-checks

      - name: Publish markup-generator to npm
        if: ${{ github.event_name == 'release' || inputs.dry_run != true }}
        run: pnpm -r publish --access public --no-git-checks --provenance
