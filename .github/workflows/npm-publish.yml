# Publish markup-generator + @llazyemail/* to npm when a GitHub Release is published.
#
# `pnpm -r publish` walks the workspace in topological order, so the leaf
# packages (@llazyemail/fs → write → read/email/cli → template) are published
# before the root core barrel `markup-generator`. `workspace:^` ranges are
# rewritten to real versions (e.g. ^4.0.0) in each published package.json.
# Packages whose current version is already on npm are skipped, and
# private packages (@llazyemail/core stub) are never published.
# Auth: npm trusted publishing (OIDC, id-token: write) — each @llazyemail/*
# package must have this repo/workflow registered as a trusted publisher.

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (do not publish)'
        required: false
        type: boolean
        default: true

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm exec turbo run build test lint

      - name: Publish dry run (all packages, topological order)
        run: pnpm -r publish --dry-run --access public --no-git-checks

      - name: Publish to npm (leaf packages first, markup-generator last)
        if: ${{ github.event_name == 'release' || inputs.dry_run != true }}
        run: pnpm -r publish --access public --no-git-checks --provenance
